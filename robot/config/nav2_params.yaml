# nav2 minimal pour mowbot : carte statique de l'arene (pas de capteur),
# vitesses calees sur le seuil de friction des moteurs (>=0.13 m/s, 0.5 rad/s).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # robot de 58 cm de long : viser 8 cm etait irrealiste (le dernier
      # centimetre prenait plus longtemps que tout le trajet, a 0.048 m/s).
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20
      stateful: True
    # ==========================================================
    #  CONTROLEUR : DWB  (choisi pour les obstacles dynamiques)
    #
    #  Remplace Regulated Pure Pursuit, qui est un SUIVEUR de chemin : il
    #  n'a qu'un seul comportement, suivre la ligne planifiee. Des qu'elle
    #  etait bloquee il s'arretait ("detected collision ahead" en boucle)
    #  sans jamais envisager de passer a cote, meme avec de la place.
    #
    #  DWB echantillonne a chaque cycle un eventail de couples (v, w)
    #  realisables, simule chaque trajectoire et garde la mieux notee par
    #  les "critics". Il contourne donc de lui-meme et reagit a ce qui
    #  bouge : c'est le comportement voulu en environnement dynamique.
    #
    #  Retour arriere possible : le bloc RPP est conserve en commentaire
    #  juste en dessous.
    # ==========================================================
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # -- enveloppe de vitesse : valeurs MESUREES sur le robot --
      # min_vel_x NEGATIF = marche arriere autorisee. DWB decide lui-meme de
      # reculer si c'est la meilleure trajectoire, sans attendre un
      # comportement de recuperation.
      min_vel_x: -0.055
      max_vel_x: 0.055
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.22
      min_speed_xy: 0.0
      max_speed_xy: 0.055
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      # -- echantillonnage --
      # 40 echantillons en rotation : c'est la rotation qui permet de
      # contourner. Le robot est tres lent, le CPU suit largement.
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40
      # 4 s d'anticipation = 22 cm seulement a 0.055 m/s. Plus court, le
      # robot ne verrait pas assez loin pour amorcer un evitement.
      sim_time: 4.0
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: True
      stateful: True

      # -- notation des trajectoires --
      # ObstacleFootprint plutot que BaseObstacle : BaseObstacle ne regarde
      # que le cout sous le CENTRE du robot, ce qui est faux pour un chassis
      # non circulaire. ObstacleFootprint teste le contour complet.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.05
      ObstacleFootprint.sum_scores: False
      # PathAlign/PathDist tirent vers le chemin global, GoalAlign/GoalDist
      # vers le but. Suivre le chemin domine, mais DWB garde la liberte de
      # s'en ecarter pour eviter un obstacle.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # anti-blocage : interdit d'alterner indefiniment gauche/droite au
      # meme endroit.
      Oscillation.scale: 10.0
      Oscillation.oscillation_reset_dist: 0.10
      Oscillation.oscillation_reset_angle: 0.30
      Oscillation.x_only_threshold: 0.02

    # --- ANCIEN controleur Regulated Pure Pursuit (conserve pour retour arriere) ---
    # FollowPath:
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   # Alignee sur la vitesse PHYSIQUE max (0.055 m/s mesuree), pas en
    #   # dessous : le joystick, lui, demande 0.5 m/s -> il sature a 100 % de
    #   # puissance en permanence, d'ou l'impression qu'il va plus vite que la
    #   # navigation qui, elle, se limitait a 0.048 (= 80 % de puissance).
    #   desired_linear_vel: 0.055
    #   # Le point de poursuite doit tomber DEVANT le robot : l'avant du chassis
    #   # est a 0.24 m, un lookahead de 0.20 visait donc un point situe DANS le
    #   # robot -> braquages permanents, oscillations, blocages.
    #   lookahead_dist: 0.35
    #   min_lookahead_dist: 0.28
    #   max_lookahead_dist: 0.50
    #   use_velocity_scaled_lookahead_dist: false
    #   transform_tolerance: 0.3
    #   min_approach_linear_velocity: 0.03
    #   approach_velocity_scaling_dist: 0.12
    #   use_collision_detection: true
    #   max_allowed_time_to_collision_up_to_carrot: 0.5
    #   use_regulated_linear_velocity_scaling: true
    #   # plancher en courbe : ne pas retomber sous 0.045 (etait 0.03, soit
    #   # presque la moitie de la vitesse de croisiere perdue a chaque virage)
    #   regulated_linear_scaling_min_speed: 0.045
    #   use_cost_regulated_linear_velocity_scaling: false
    #   use_rotate_to_heading: false
    #   allow_reversing: true
    #   rotate_to_heading_min_angle: 0.5
    #   rotate_to_heading_angular_vel: 0.18
    #   max_angular_accel: 1.5
    #   max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      # Contour REEL (base_link = milieu de l'essieu), releve sur photo :
      #   - disque bois rayon 0.22
      #   - point le plus large = les PNEUS, +/-0.26 (entraxe 0.48 + largeur roue)
      #   - petite languette arriere portant la roulette : -0.27, sur 15 cm large
      # Un robot_radius unique devrait couvrir 0.27 partout, soit 5 cm de
      # bourrelet inutile tout autour -> passages refuses sans raison. Utile
      # aussi maintenant que la marche arriere est autorisee : la languette
      # est protegee sans elargir l'arriere.
      footprint: "[[0.22, 0.10], [0.08, 0.26], [-0.08, 0.26], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.26], [0.08, -0.26], [0.22, -0.10]]"
      # 1 cm (etait 2) : marge ajoutee TOUT AUTOUR du contour. Le contour est
      # deja releve au reel ; 2 cm de plus rendaient des passages justes
      # inexecutables -- le planificateur global les jugeait franchissables et
      # le controleur refusait ensuite d'y aller.
      footprint_padding: 0.01
      # PAS de static_layer ici, volontairement. Le costmap LOCAL doit refleter
      # ce que le lidar voit MAINTENANT. En y superposant la carte SLAM, il
      # heritait de tous les faux echos accumules dans la carte -- et ceux-la
      # ne s'effacent jamais par balayage laser, contrairement aux obstacles
      # observes. Constat : le lidar voyait l'obstacle a 0.38 m alors que la
      # carte gardait une cellule occupee a 0.26 m, pile sur le bord du
      # footprint -> "No valid trajectories out of 860", blocage total.
      # La carte statique reste utilisee par le costmap GLOBAL, pour planifier.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # LOCAL = execution. Reste bas (5 cm) : c'est cette couche qui faisait
        # refuser des passages franchissables ("ca bloque pour rien"). La
        # securite reelle est assuree par le footprint, qui est exact.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.02
      # meme contour reel que le local_costmap (cf. commentaire plus haut)
      footprint: "[[0.22, 0.10], [0.08, 0.26], [-0.08, 0.26], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.26], [0.08, -0.26], [0.22, -0.10]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # GLOBAL = planification. Halo LARGE et gradient DOUX : c'est ce qui
        # ecarte le chemin des obstacles. A 5 cm le cout retombait a zero des
        # 6 cm, donc raser un mur ne coutait pas plus cher que de passer au
        # large -> le chemin collait aux obstacles. L'inflation ne bloque
        # jamais au-dela du rayon inscrit du robot : elle ne fait qu'orienter.
        # 0.30/2.5 = optimum MESURE (nodes/pathcheck.py, 8 buts a 1.6 m).
        # 0.45 : chemins 8 % plus longs pour exactement la meme marge.
        # 0.60 : contre-productif, marge tombee a 0.00 m -> une inflation trop
        # large sature la carte, les halos se recouvrent, le gradient s'aplatit
        # et le planificateur n'a plus rien pour se decider : il reprend le plus
        # court, donc il rase. Ne pas monter au-dela de 0.30 dans un interieur.
        inflation_radius: 0.30
        cost_scaling_factor: 2.5
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # __HOME__ est substitue a l'installation (install.sh) : aucun chemin
    # en dur, l'arborescence doit suivre le SBC (Jetson -> Raspberry Pi).
    # Inutilise tant qu'on cartographie en SLAM (slam_toolbox fournit la carte).
    yaml_filename: "__HOME__/mowbot/maps/arena.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    max_rotational_vel: 0.15
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.06, 0.0, 0.22]
    min_velocity: [-0.06, 0.0, -0.22]
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.6, 0.0, -1.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ============================================================
#  collision_monitor — OBLIGATOIRE a partir de Jazzy
#
#  Ce noeud n'existait pas dans le bringup Humble. navigation_launch.py le
#  demarre desormais systematiquement, et s'il ne trouve pas sa configuration
#  il echoue ("parameter 'observation_sources' is not initialized"). Le
#  lifecycle_manager abandonne alors TOUTE la pile : controller_server et
#  planner_server restent "inactive", les buts sont acceptes mais rien ne
#  bouge, et aucun noeud ne s'abonne a /scan.
#
#  Role : dernier rempart materiel-logiciel. Il surveille /scan et bride ou
#  coupe /cmd_vel si une collision devient imminente, independamment du
#  controleur. Utile pour une tondeuse.
# ============================================================
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Ralentit a l'approche plutot que de bloquer net : le robot est deja tres
    # lent (0.055 m/s), un arret franc le figerait pour un simple reflet.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.10
      max_height: 2.0
      enabled: True

# ============================================================
#  docking_server — OBLIGATOIRE a partir de Jazzy
#
#  Autre noeud absent du bringup Humble : il gere l'accostage sur une station
#  de recharge. navigation_launch.py le demarre toujours, et sans plugin
#  declare il refuse de se configurer ("Charging dock plugins not given!"),
#  ce qui fait AVORTER TOUTE la pile nav2 par le lifecycle_manager.
#
#  Le robot n'a pas de station de recharge : on declare le plugin standard
#  pour satisfaire le noeud, sans declarer aucune station. Le jour ou une
#  base de recharge existera, il suffira de lister les stations dans `docks`.
# ============================================================
docking_server:
  ros__parameters:
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
