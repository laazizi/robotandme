# nav2 minimal pour mowbot : carte statique de l'arene (pas de capteur),
# vitesses calees sur le seuil de friction des moteurs (>=0.13 m/s, 0.5 rad/s).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # robot de 58 cm de long : viser 8 cm etait irrealiste (le dernier
      # centimetre prenait plus longtemps que tout le trajet, a 0.048 m/s).
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Alignee sur la vitesse PHYSIQUE max (0.055 m/s mesuree), pas en
      # dessous : le joystick, lui, demande 0.5 m/s -> il sature a 100 % de
      # puissance en permanence, d'ou l'impression qu'il va plus vite que la
      # navigation qui, elle, se limitait a 0.048 (= 80 % de puissance).
      desired_linear_vel: 0.055
      # Le point de poursuite doit tomber DEVANT le robot : l'avant du chassis
      # est a 0.24 m, un lookahead de 0.20 visait donc un point situe DANS le
      # robot -> braquages permanents, oscillations, blocages.
      lookahead_dist: 0.35
      min_lookahead_dist: 0.28
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.12
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      # plancher en courbe : ne pas retomber sous 0.045 (etait 0.03, soit
      # presque la moitie de la vitesse de croisiere perdue a chaque virage)
      regulated_linear_scaling_min_speed: 0.045
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.18
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      # Contour REEL (base_link = milieu de l'essieu), releve sur photo :
      #   - disque bois rayon 0.22
      #   - point le plus large = les PNEUS, +/-0.26 (entraxe 0.48 + largeur roue)
      #   - petite languette arriere portant la roulette : -0.27, sur 15 cm large
      # Un robot_radius unique devrait couvrir 0.27 partout, soit 5 cm de
      # bourrelet inutile tout autour -> passages refuses sans raison. Utile
      # aussi maintenant que la marche arriere est autorisee : la languette
      # est protegee sans elargir l'arriere.
      footprint: "[[0.22, 0.10], [0.08, 0.26], [-0.08, 0.26], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.26], [0.08, -0.26], [0.22, -0.10]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        transform_tolerance: 0.3
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 5 cm : le footprint polygonal decrit deja la taille REELLE du robot
        # (+2 cm de padding), l'inflation n'est plus la que pour lisser la
        # trajectoire. A 10 cm elle refusait des passages franchissables.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.02
      # meme contour reel que le local_costmap (cf. commentaire plus haut)
      footprint: "[[0.22, 0.10], [0.08, 0.26], [-0.08, 0.26], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.26], [0.08, -0.26], [0.22, -0.10]]"
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 5 cm : le footprint polygonal decrit deja la taille REELLE du robot
        # (+2 cm de padding), l'inflation n'est plus la que pour lisser la
        # trajectoire. A 10 cm elle refusait des passages franchissables.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    yaml_filename: "/home/nvidia/maps/arena.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    max_rotational_vel: 0.15
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.06, 0.0, 0.22]
    min_velocity: [-0.06, 0.0, -0.22]
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.6, 0.0, -1.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
