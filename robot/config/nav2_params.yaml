# nav2 minimal pour mowbot : carte statique de l'arene (pas de capteur),
# vitesses calees sur le seuil de friction des moteurs (>=0.13 m/s, 0.5 rad/s).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    # CES DEUX VALEURS SONT LIEES, et les monter ensemble est indispensable.
    # default_server_timeout est en MILLISECONDES (defaut nav2 : 20), et le code
    # de nav2_behavior_tree l'ECRETE :
    #     max_timeout_ = bt_loop_duration * 0.5
    # Avec bt_loop_duration a 10 ms, le delai d'attente d'un serveur d'action
    # etait donc plafonne a CINQ MILLISECONDES. Sur cette machine, ou l'on
    # mesure regulierement de la contention, c'est intenable : nav2 abandonnait
    # le but avant meme d'avoir commence, avec
    #   Timed out while waiting for action server to acknowledge goal request
    # 16 fois, et des buts qui echouaient en 0,1 s. Monter le seul
    # default_server_timeout n'aurait rien change a cause de l'ecretage.
    # bt_loop_duration a 100 ms = arbre cadence a 10 Hz, comme le controleur.
    # A 0,30 m/s cela represente 3 cm de trajet entre deux evaluations : sans
    # consequence pour une tondeuse, et cela divise par dix le cout de parcours
    # de l'arbre. Le delai effectif devient 50 ms, soit 2,5 fois le defaut nav2.
    bt_loop_duration: 100
    default_server_timeout: 50
    # NOTRE arbre de comportement, et non celui de nav2. Un seul changement :
    # l'ordre des actions de degagement. L'amont essaie d'abord d'effacer les
    # costmaps, PUIS DE TOURNER SUR PLACE, PUIS D'ATTENDRE 5 s, et ne recule
    # qu'en quatrieme. Sur ce chassis non circulaire (0.54 x 0.50 m), tourner
    # sur place contre un obstacle balaie les coins du contour dedans : la
    # rotation est refusee et le robot reste coince. Mesure : 8 "Goal failed"
    # pour UN SEUL "BackUp" dans le journal.
    # Reculer passe donc en deuxieme, juste apres l'effacement des costmaps qui
    # est gratuit et sans mouvement. Details dans config/bt_mowbot.xml.
    # __HOME__ est substitue par install.sh : les YAML n'acceptent pas de
    # variable d'environnement, et le chemin doit etre valide DANS le conteneur
    # (le code est monte au meme chemin dedans et dehors).
    default_nav_to_pose_bt_xml: "__HOME__/mowbot/config/bt_mowbot.xml"

controller_server:
  ros__parameters:
    # 10 Hz et non 20 : a 0.30 m/s le robot avance 3 cm entre deux cycles, ce
    # qui reste tres fin devant son gabarit. Sur une Raspberry Pi 4, 20 Hz
    # doublait inutilement la charge du controleur -- or c'est la saturation
    # (charge 24 sur 4 coeurs) qui faisait rejeter les messages dans RViz.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # robot de 58 cm de long : viser 8 cm etait irrealiste (le dernier
      # centimetre prenait plus longtemps que tout le trajet, a 0.048 m/s).
      xy_goal_tolerance: 0.12
      # 3.15 rad, soit PLUS DE 180 DEGRES : autant dire "le cap n'importe pas".
      # A 0.20 rad (11,5 deg) le robot devait finir aligne sur le cap demande, donc
      # il PIVOTAIT SUR PLACE a chaque arrivee -- jusqu'a 3 s par point a
      # max_vel_theta 1.0 rad/s, pour une orientation dont on n'a le plus souvent
      # rien a faire sur un point de passage.
      #
      # QUAND LE REMETTRE SERRE : si un point exige une orientation precise --
      # aborder une rangee de tonte dans le bon sens, se presenter face a une
      # station de charge, franchir un passage etroit. Le cap de chaque point
      # reste transmis dans le but : c'est seulement le CONTROLE d'arrivee qui
      # ne l'exige plus.
      # Variante plus explicite si l'on veut ignorer le cap par construction :
      #   plugin: "nav2_controller::PositionGoalChecker"   (ne verifie que x, y)
      # On garde SimpleGoalChecker : un seul nombre a changer pour revenir en
      # arriere, contre un changement de greffon.
      yaw_goal_tolerance: 3.15
      stateful: True
    # ==========================================================
    #  CONTROLEUR : DWB  (choisi pour les obstacles dynamiques)
    #
    #  Remplace Regulated Pure Pursuit, qui est un SUIVEUR de chemin : il
    #  n'a qu'un seul comportement, suivre la ligne planifiee. Des qu'elle
    #  etait bloquee il s'arretait ("detected collision ahead" en boucle)
    #  sans jamais envisager de passer a cote, meme avec de la place.
    #
    #  DWB echantillonne a chaque cycle un eventail de couples (v, w)
    #  realisables, simule chaque trajectoire et garde la mieux notee par
    #  les "critics". Il contourne donc de lui-meme et reagit a ce qui
    #  bouge : c'est le comportement voulu en environnement dynamique.
    #
    #  Retour arriere possible : le bloc RPP est conserve en commentaire
    #  juste en dessous.
    # ==========================================================
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # -- enveloppe de vitesse : valeurs MESUREES sur le robot --
      # min_vel_x NEGATIF = marche arriere autorisee. DWB decide lui-meme de
      # reculer si c'est la meilleure trajectoire, sans attendre un
      # comportement de recuperation.
      min_vel_x: -0.055
      max_vel_x: 0.055
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.22
      # LAISSER A ZERO. Ces deux seuils ne peuvent PAS servir a imposer le seuil
      # de friction des moteurs, et l'essai a immobilise le robot.
      # Regle de DWB (dwb_plugins/kinematic_parameters.hpp, isValidSpeed) : une
      # trajectoire est rejetee si vitesse < min_speed_xy ET rotation <
      # min_speed_theta. Or DWB n'echantillonne que la fenetre ATTEIGNABLE depuis
      # la vitesse actuelle. Depuis l'ARRET, a 10 Hz : 0.8 x 0.1 = 0.08 m/s et
      # 2.0 x 0.1 = 0.20 rad/s. Des seuils de 0.13 / 0.5 couvraient donc TOUTE
      # cette fenetre : aucune trajectoire valide, le robot ne demarrait plus du
      # tout, et les buts envoyes depuis RViz restaient sans effet.
      # La compensation de friction appartient au FIRMWARE (minimum de PWM ou
      # terme d'anticipation cote moteur), pas au test de validite d'une
      # trajectoire. Detail complet dans config/speeds.env.
      # Les valeurs restent pilotees par le profil, avec un controle de coherence
      # dans start_nav.sh, au cas ou l'on voudrait un jour les reactiver.
      min_speed_xy: 0.0
      max_speed_xy: 0.055
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      # -- echantillonnage --
      # 40 echantillons en rotation : c'est la rotation qui permet de
      # contourner. Le robot est tres lent, le CPU suit largement.
      # 10 x 20 = 200 trajectoires au lieu de 20 x 40 = 800 (DWB en annonçait
      # 860 avec les rotations sur place). Le controller_server consommait 43 %
      # d'un coeur -- le double du planner -- et ratait sa cadence de 10 Hz 673
      # fois : c'est l'evaluation des trajectoires qui coute, pas la
      # planification.
      # 200 reste au-dessus du defaut de nav2 pour un diffdrive (20 x 20 = 400
      # en comptant vy, mais vy_samples=1 ici puisque le robot ne se translate
      # pas lateralement). Si l'evitement devient trop grossier, remonter
      # vtheta_samples en premier : c'est la finesse de braquage.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      # 4 s d'anticipation = 22 cm seulement a 0.055 m/s. Plus court, le
      # robot ne verrait pas assez loin pour amorcer un evitement.
      sim_time: 4.0
      # Pas d'echantillonnage des trajectoires simulees. A 0.02 m, une
      # trajectoire de 0.9 m (3 s a 0.30 m/s) comptait 45 points, et 860
      # trajectoires faisaient 39 000 evaluations par cycle, dix fois par
      # seconde. A 0.04 m c'est la moitie, et le robot fait 50 cm de large :
      # 4 cm de resolution suffisent largement a detecter un obstacle.
      linear_granularity: 0.04
      angular_granularity: 0.05
      # 0.6 s au lieu de 0.3, MESURE sur le Jetson : les TF sont publiees
      # environ 280 ms apres l horodatage des scans, si bien que la valeur par
      # defaut de nav2 tombait PILE sur le seuil. Resultat : 73 erreurs
      # "Extrapolation Error looking up target frame" et des buts qui
      # echouaient une fois sur deux, sans logique apparente.
      # Ce n est pas gratuit : nav2 planifie alors sur une pose vieille de
      # 0.6 s, soit 18 cm parcourus a 0.30 m/s. Acceptable pour une tondeuse.
      # A resserrer si le SLAM se met un jour a publier plus vite.
      # 1.0 s et non 0.6 : MITIGATION ASSUMEE, pas une correction.
      # Sous charge de navigation, nav2 abandonnait des buts sur
      #   Transform data too old when converting from odom to map
      #   Data time: ...444.500  Transform time: ...443.899
      # soit exactement 0,600 s d ecart : on tapait pile la tolerance.
      # Or les donnees ne sont PAS reellement perimees. Mesure au repos :
      #   /scan_raw +0,002 s   /odom +0,054 s   /imu +0,045 s
      #   map->odom -0,13 s    odom->base_link +0,081 s a 15,0 Hz
      # Tout arrive en quelques dizaines de millisecondes. Ce sont des a-coups
      # transitoires sous charge qui franchissent le seuil, pas une chaine
      # lente. 1,0 s laisse la marge pour les absorber sans jamais agir sur
      # une pose vraiment vieille.
      # LA VRAIE CORRECTION est de reduire la charge en navigation (voir la
      # frequence du costmap local ci-dessous et ekf.yaml). Si les a-coups
      # disparaissent, redescendre ce seuil : une tolerance large masque un
      # probleme de fraicheur au lieu de le signaler.
      transform_tolerance: 1.0
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: True
      stateful: True

      # -- notation des trajectoires --
      # ObstacleFootprint plutot que BaseObstacle : BaseObstacle ne regarde
      # que le cout sous le CENTRE du robot, ce qui est faux pour un chassis
      # non circulaire. ObstacleFootprint teste le contour complet.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.05
      ObstacleFootprint.sum_scores: False
      # PathAlign/PathDist tirent vers le chemin global, GoalAlign/GoalDist
      # vers le but. Suivre le chemin domine, mais DWB garde la liberte de
      # s'en ecarter pour eviter un obstacle.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      # ADHERENCE AU CHEMIN GLOBAL, le vert de RViz. Il n'existe pas de
      # "tolerance" pour cela : ce sont ces poids qui decident si le robot colle
      # a son chemin ou s'en ecarte. PathDist penalise l'ECART LATERAL au
      # chemin, PathAlign le desalignement de cap ; GoalDist et GoalAlign tirent
      # vers le BUT en ligne droite. Avec 32 contre 24, le chemin ne l'emportait
      # que d'un tiers : sur une capture RViz, le chemin vert finissait en haut a
      # droite du robot pendant que sa trajectoire locale partait a gauche.
      # 48 contre 24 : le chemin pese desormais le DOUBLE du tir direct au but.
      #
      # forward_point_distance passe de 0.15 a 0.325, LE DEFAUT DE NAV2. Les
      # criteres d'alignement notent un point projete devant le robot : a 0.15 m
      # ce point est presque sur lui, et la mesure d'alignement devient peu
      # sensible. C'etait diviser par deux l'effet des deux critere de cap.
      #
      # NE PAS MONTER BEAUCOUP PLUS HAUT. Un PathDist qui ecrase tout rend le
      # robot RIGIDE : il refuse de s'ecarter du chemin pour contourner un
      # obstacle apparu depuis, et se bloque au lieu de devier. Le reglage est un
      # equilibre entre "il coupe les virages" et "il ne sait plus eviter".
      # Pour revenir en arriere : PathDist 32, forward_point_distance 0.15.
      PathDist.scale: 48.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # anti-blocage : interdit d'alterner indefiniment gauche/droite au
      # meme endroit.
      Oscillation.scale: 10.0
      Oscillation.oscillation_reset_dist: 0.10
      Oscillation.oscillation_reset_angle: 0.30
      Oscillation.x_only_threshold: 0.02

    # --- ANCIEN controleur Regulated Pure Pursuit (conserve pour retour arriere) ---
    # FollowPath:
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   # Alignee sur la vitesse PHYSIQUE max (0.055 m/s mesuree), pas en
    #   # dessous : le joystick, lui, demande 0.5 m/s -> il sature a 100 % de
    #   # puissance en permanence, d'ou l'impression qu'il va plus vite que la
    #   # navigation qui, elle, se limitait a 0.048 (= 80 % de puissance).
    #   desired_linear_vel: 0.055
    #   # Le point de poursuite doit tomber DEVANT le robot : l'avant du chassis
    #   # est a 0.24 m, un lookahead de 0.20 visait donc un point situe DANS le
    #   # robot -> braquages permanents, oscillations, blocages.
    #   lookahead_dist: 0.35
    #   min_lookahead_dist: 0.28
    #   max_lookahead_dist: 0.50
    #   use_velocity_scaled_lookahead_dist: false
    #   transform_tolerance: 0.3
    #   min_approach_linear_velocity: 0.03
    #   approach_velocity_scaling_dist: 0.12
    #   use_collision_detection: true
    #   max_allowed_time_to_collision_up_to_carrot: 0.5
    #   use_regulated_linear_velocity_scaling: true
    #   # plancher en courbe : ne pas retomber sous 0.045 (etait 0.03, soit
    #   # presque la moitie de la vitesse de croisiere perdue a chaque virage)
    #   regulated_linear_scaling_min_speed: 0.045
    #   use_cost_regulated_linear_velocity_scaling: false
    #   use_rotate_to_heading: false
    #   allow_reversing: true
    #   rotate_to_heading_min_angle: 0.5
    #   rotate_to_heading_angular_vel: 0.18
    #   max_angular_accel: 1.5
    #   max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      # RETOUR A 5 Hz. Je l avais monte a 10 pour l aligner sur
      # controller_frequency, sur un raisonnement -- jamais sur une mesure. Cela
      # double le travail de raytracing du costmap, et le controleur BLOQUE sur le
      # verrou du costmap pendant sa mise a jour.
      # Symptome constate ensuite : le controleur tournait a 2,17 a 5,76 Hz au lieu
      # de 10, tout en n utilisant que 43 % d UN coeur sur six -- donc il ATTENDAIT,
      # il ne calculait pas. La machine avait 65 % d inactivite (213 % sur 600 %).
      # 5 Hz reste deux fois la cadence du lidar (2,5 scans par mise a jour) : on ne
      # perd aucune information reelle, le lidar ne fournit rien de plus vite.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      # 4 cm au lieu de 2 : QUATRE fois moins de cellules a inflater et a
      # parcourir a chaque cycle. C'est le plus gros gain de charge, et 4 cm
      # reste fin face a un robot de 46 cm d'entraxe.
      resolution: 0.04
      # Contour REEL (base_link = milieu de l'essieu), releve sur photo :
      #   - disque bois rayon 0.22
      #   - point le plus large = les PNEUS, +/-0.26 (entraxe 0.48 + largeur roue)
      #   - petite languette arriere portant la roulette : -0.27, sur 15 cm large
      # Un robot_radius unique devrait couvrir 0.27 partout, soit 5 cm de
      # bourrelet inutile tout autour -> passages refuses sans raison. Utile
      # aussi maintenant que la marche arriere est autorisee : la languette
      # est protegee sans elargir l'arriere.
      # LARGEUR RAMENEE de 0.26 a 0.25 (demande utilisateur, 1 cm).
      # Le bord exterieur des roues est a ±0.2529 m (demi-entraxe calibre
      # 0.23035 + demi-largeur de roue 0.0225). Avec l'ancienne valeur, le
      # contour effectif atteignait ±0.270 padding compris : un obstacle a 1 cm
      # de la roue tombait DANS l'empreinte, et DWB rejetait les 860
      # trajectoires ("ObstacleFootprint/Trajectory Hits Obstacle", 540 fois
      # dans le journal). A ±0.250 + 0.010 de padding, le contour s'arrete a
      # 0.260 et laisse 3 mm devant un obstacle a 1 cm.
      # ATTENTION : 3 mm, c'est peu. Une erreur de localisation d'un centimetre
      # suffit alors a ce que la roue touche VRAIMENT. Cette marge a ete reduite
      # sciemment ; ne pas la rogner davantage sans y repenser.
      footprint: "[[0.22, 0.10], [0.08, 0.25], [-0.08, 0.25], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.25], [0.08, -0.25], [0.22, -0.10]]"
      # 1 cm (etait 2) : marge ajoutee TOUT AUTOUR du contour. Le contour est
      # deja releve au reel ; 2 cm de plus rendaient des passages justes
      # inexecutables -- le planificateur global les jugeait franchissables et
      # le controleur refusait ensuite d'y aller.
      footprint_padding: 0.01
      # PAS de static_layer ici, volontairement. Le costmap LOCAL doit refleter
      # ce que le lidar voit MAINTENANT. En y superposant la carte SLAM, il
      # heritait de tous les faux echos accumules dans la carte -- et ceux-la
      # ne s'effacent jamais par balayage laser, contrairement aux obstacles
      # observes. Constat : le lidar voyait l'obstacle a 0.38 m alors que la
      # carte gardait une cellule occupee a 0.26 m, pile sur le bord du
      # footprint -> "No valid trajectories out of 860", blocage total.
      # La carte statique reste utilisee par le costmap GLOBAL, pour planifier.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # LOCAL = execution. Reste bas (5 cm) : c'est cette couche qui faisait
        # refuser des passages franchissables ("ca bloque pour rien"). La
        # securite reelle est assuree par le footprint, qui est exact.
        #
        # NAV2 SE PLAINT ICI, ET C'EST NORMAL. A chaque configuration il ecrit :
        #   The configured inflation radius (0.050) is smaller than the computed
        #   inscribed radius (0.230) of your footprint
        # Ce message suppose la convention INVERSE de la notre : robot traite
        # comme un point, et inflation >= rayon inscrit chargee de representer sa
        # taille. C'est ce qu'exige le critere BaseObstacle, que nous n'utilisons
        # PAS (voir critics, plus haut : ObstacleFootprint).
        # ObstacleFootprint teste le contour complet contre le costmap. Monter
        # l'inflation a 0.23 compterait donc la taille du robot DEUX FOIS : les
        # cellules a moins de 23 cm d'un obstacle deviennent bloquantes, et comme
        # le contour s'etend deja a 25 cm, le robot refuserait tout passage de
        # moins de ~48 cm alors qu'il en fait 50 de large et ne touche qu'a 23.
        # C'est exactement le "ca bloque pour rien" corrige plus haut.
        # NE PAS "corriger" cette valeur pour faire taire l'erreur. Si l'on
        # voulait la faire taire, il faudrait passer a BaseObstacle + robot_radius
        # -- au prix d'un contour circulaire, faux pour ce chassis.
        # Les 5 cm ne sont pas nuls pour autant : etant sous le rayon inscrit,
        # toute cellule qu'ils marquent devient bloquante, ce qui donne 5 cm de
        # marge reelle autour des obstacles. Mesure au mur : 1 cm de jeu physique.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.04
      # meme contour reel que le local_costmap (cf. commentaire plus haut)
      footprint: "[[0.22, 0.10], [0.08, 0.25], [-0.08, 0.25], [-0.20, 0.14], [-0.27, 0.08], [-0.27, -0.08], [-0.20, -0.14], [-0.08, -0.25], [0.08, -0.25], [0.22, -0.10]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # GLOBAL = planification. Halo LARGE et gradient DOUX : c'est ce qui
        # ecarte le chemin des obstacles. A 5 cm le cout retombait a zero des
        # 6 cm, donc raser un mur ne coutait pas plus cher que de passer au
        # large -> le chemin collait aux obstacles. L'inflation ne bloque
        # jamais au-dela du rayon inscrit du robot : elle ne fait qu'orienter.
        # 0.30/2.5 = optimum MESURE (nodes/pathcheck.py, 8 buts a 1.6 m).
        # 0.45 : chemins 8 % plus longs pour exactement la meme marge.
        # 0.60 : contre-productif, marge tombee a 0.00 m -> une inflation trop
        # large sature la carte, les halos se recouvrent, le gradient s'aplatit
        # et le planificateur n'a plus rien pour se decider : il reprend le plus
        # court, donc il rase. Ne pas monter au-dela de 0.30 dans un interieur.
        # 0.50 : BALAYAGE MESURE avec nodes/pathcheck.py dans le salon encombre,
        # 8 buts a 45 degres d intervalle. Ecart minimal chemin/obstacle observe :
        #   0.30 -> aucun chemin trouve, ou 0,03 m quand il en trouvait un
        #   0.45 -> 6 buts sur 8, ecart typique 0,13 a 0,42 m
        #   0.60 -> 5 buts sur 8, ecart typique 0,22 a 0,27 m
        # Le robot fait 0,27 m de demi-largeur : a 0.30 la marge etait NEGATIVE de
        # 24 cm, le chemin traversait l emprise du robot.
        # 0.50 est le compromis : on garde la joignabilite de 0.45 et l essentiel de
        # l ecart de 0.60. Monter plus haut reduit le nombre de buts atteignables
        # sans ameliorer le PIRE cas.
        #
        # CE QUE CE REGLAGE NE PEUT PAS CORRIGER : le pire ecart reste a 0,04 m dans
        # les trois cas. Cela signifie qu au moins un passage est PLUS ETROIT que le
        # robot. Aucune inflation n y changera rien -- il faut degager le passage, ou
        # ne pas y envoyer le robot.
        #
        # La note precedente disait "0.60 contre-productif, marge tombee a 0.00" : ce
        # releve venait d une arene de test de 2x2 m avec un cylindre, pas d une
        # piece meublee. Les deux mesures sont vraies dans leur contexte.
        inflation_radius: 0.50
        cost_scaling_factor: 2.5
      # TRUE, ET NE PAS LE REPASSER A FALSE. Je l avais mis a False pour soulager
      # le WiFi -- un gain THEORIQUE, jamais mesure -- et cela a rendu le costmap
      # global INOBTENABLE : ni /global_costmap/costmap ni son topic _updates ne
      # publiaient plus rien. Consequences constatees :
      #   . nodes/pathcheck.py, l outil qui MESURE la marge des chemins aux
      #     obstacles, repondait "pas de costmap globale" ;
      #   . l affichage du costmap global dans RViz ne recevait plus rien.
      # Le publieur est pourtant RELIABLE + TRANSIENT_LOCAL : le probleme n est
      # pas la QoS, c est qu il n y a plus aucun message a retenir.
      # La congestion RViz que je cherchais a corriger venait en realite de la
      # fraicheur des TF, pas du volume du costmap.
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # __HOME__ est substitue a l'installation (install.sh) : aucun chemin
    # en dur, l'arborescence doit suivre le SBC (Jetson -> Raspberry Pi).
    # Inutilise tant qu'on cartographie en SLAM (slam_toolbox fournit la carte).
    yaml_filename: "__HOME__/mowbot/maps/arena.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # SYNTAXE JAZZY : "paquet::Classe". Humble utilisait "paquet/Classe", et
      # install.sh fait la conversion INVERSE si la distro cible est Humble.
      # Le fichier source porte desormais la syntaxe moderne, parce que c'est
      # celle des deux machines du projet -- et parce qu'une copie directe dans
      # config/, sans passer par install.sh, reintroduisait sinon l'ancienne
      # syntaxe. Symptome : planner_server FATAL "the class
      # nav2_navfn_planner/NavfnPlanner does not exist", le lifecycle_manager
      # abandonne TOUTE la pile, et bt_navigator reste unconfigured : les buts
      # ne sont plus recus du tout.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 0.25 m et non 0.10 : distance a laquelle le planificateur s'autorise a
      # viser une cellule VOISINE quand le but exact n'est pas joignable (but
      # pose dans un halo d'inflation, ou a un centimetre d'un mur). A 0.10 il
      # renoncait pour presque rien, avec
      #   Failed to create plan with tolerance of: 0.1
      # 25 cm sur un point de passage de tonte n'a aucune importance pratique.
      tolerance: 0.25
      use_astar: true
      # allow_unknown A TRUE : LE PLANIFICATEUR PEUT TRAVERSER L'INCONNU.
      #
      # A false, combine a track_unknown_space: true du costmap global, le robot
      # etait enferme dans les seules cellules DEJA VUES comme libres. MESURE
      # sur la carte du salon : 83,4 % d'inconnu, 13,5 % de libre. Tout
      # l'inconnu se comportait comme un MUR, meme la ou il n'y a rien. Une
      # ligne droite vers un but traversant de l'inconnu etait donc INTERDITE,
      # et le robot contournait par les minces couloirs deja cartographies -- ce
      # qui ressemble a un defaut d'optimisation alors que c'est une
      # interdiction. Et un but simplement entoure d'inconnu : aucun chemin.
      #
      # POUR UNE TONDEUSE C'EST LE REGLAGE INDISPENSABLE : couvrir un jardin
      # veut precisement dire aller sur du terrain pas encore vu. Un robot qui
      # refuse l'inconnu ne peut jamais explorer.
      #
      # CE QUE CELA IMPLIQUE, et il faut l'accepter : le robot planifie a
      # travers du terrain qu'il n'a pas vu, donc il decouvre les obstacles en
      # chemin et replanifie plus souvent. Il peut avancer vers un mur qu'il
      # ignore jusqu'a ce que le lidar le revele. Ce n'est pas dangereux : le
      # costmap LOCAL et le contour reel l'arretent. Mais les trajets sont moins
      # directs qu'avec une carte complete. C'est le prix de l'exploration, et
      # il ne se paie qu'une fois par zone.
      #
      # On GARDE track_unknown_space: true dans le costmap : l'inconnu reste
      # ainsi distinct du libre a l'affichage et dans les couts. Seul le
      # planificateur s'autorise a le franchir.
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    # 0.6 s au lieu de 0.3. MESURE sur le Jetson : les TF sont publiees ~280 ms
    # apres l'horodatage des scans, la tolerance par defaut de 0.3 tombait donc
    # PILE sur le seuil -- d'ou 73 erreurs "Extrapolation Error looking up
    # target frame" et des buts qui echouaient une fois sur deux. La valeur par
    # defaut de nav2 est calee sur des machines plus rapides.
    # Ce n'est pas gratuit : nav2 accepte de planifier sur une pose vieille de
    # 0.6 s, soit 18 cm parcourus a 0.30 m/s. Acceptable pour une tondeuse ;
    # a resserrer si un jour le SLAM publie plus vite.
    transform_tolerance: 1.0
    max_rotational_vel: 0.15
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.06, 0.0, 0.22]
    min_velocity: [-0.06, 0.0, -0.22]
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.6, 0.0, -1.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ============================================================
#  collision_monitor — OBLIGATOIRE a partir de Jazzy
#
#  Ce noeud n'existait pas dans le bringup Humble. navigation_launch.py le
#  demarre desormais systematiquement, et s'il ne trouve pas sa configuration
#  il echoue ("parameter 'observation_sources' is not initialized"). Le
#  lifecycle_manager abandonne alors TOUTE la pile : controller_server et
#  planner_server restent "inactive", les buts sont acceptes mais rien ne
#  bouge, et aucun noeud ne s'abonne a /scan.
#
#  Role : dernier rempart materiel-logiciel. Il surveille /scan et bride ou
#  coupe /cmd_vel si une collision devient imminente, independamment du
#  controleur. Utile pour une tondeuse.
# ============================================================
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # 0.6 s au lieu de 0.3. MESURE sur le Jetson : les TF sont publiees ~280 ms
    # apres l'horodatage des scans, la tolerance par defaut de 0.3 tombait donc
    # PILE sur le seuil -- d'ou 73 erreurs "Extrapolation Error looking up
    # target frame" et des buts qui echouaient une fois sur deux. La valeur par
    # defaut de nav2 est calee sur des machines plus rapides.
    # Ce n'est pas gratuit : nav2 accepte de planifier sur une pose vieille de
    # 0.6 s, soit 18 cm parcourus a 0.30 m/s. Acceptable pour une tondeuse ;
    # a resserrer si un jour le SLAM publie plus vite.
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Ralentit a l'approche plutot que de bloquer net : le robot est deja tres
    # lent (0.055 m/s), un arret franc le figerait pour un simple reflet.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.10
      max_height: 2.0
      enabled: True

# ============================================================
#  docking_server — OBLIGATOIRE a partir de Jazzy
#
#  Autre noeud absent du bringup Humble : il gere l'accostage sur une station
#  de recharge. navigation_launch.py le demarre toujours, et sans plugin
#  declare il refuse de se configurer ("Charging dock plugins not given!"),
#  ce qui fait AVORTER TOUTE la pile nav2 par le lifecycle_manager.
#
#  Le robot n'a pas de station de recharge : on declare le plugin standard
#  pour satisfaire le noeud, sans declarer aucune station. Le jour ou une
#  base de recharge existera, il suffira de lister les stations dans `docks`.
# ============================================================
docking_server:
  ros__parameters:
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
