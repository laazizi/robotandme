ld14:
  ros__parameters:
    # Pilote LDRobot LD14 (nodes/ld14_node.py).
    # Valeurs confirmees en lisant le materiel (nodes/bench_lidar.py) :
    #   6.00 Hz, 391 points par tour, 2349 points/s, 98.1 % de mesures valides.
    port: /dev/mowbot_lidar     # lien udev : voir bin/detect_devices.sh
    baudrate: 115200            # LD14. Les LD06 / LD19 sont a 230400.
    frame_id: laser_link
    topic: /scan_raw            # scan_fix.py normalise ensuite vers /scan
    range_min: 0.05
    range_max: 8.0              # portee annoncee du LD14 (le N10 va a 12 m)
    # Le LD14 fait croitre son angle dans le sens horaire, ROS attend
    # l'inverse : sans cette inversion la carte serait un miroir.
    invert_angle: true
    # CRC DESACTIVE. Le calcul boucle sur 46 octets par trame, en Python, a
    # ~200 trames/s : c'est l'essentiel des 25 % de CPU du driver, sur une
    # Raspberry Pi 4 deja saturee par nav2 (charge 24, 73 C).
    # Deux raisons de s'en passer ICI :
    #   - il n'a jamais rien rejete : "CRC invalides 0.0 %" sur des dizaines de
    #     milliers de trames (liaison courte, 115200 bauds) ;
    #   - scan_fix.py supprime deja les points ISOLES, et une trame corrompue
    #     produit precisement ce genre d'aberration.
    # A REACTIVER si le cable du lidar est rallonge ou passe pres des moteurs :
    # des parasites deviendraient alors plausibles.
    check_crc: false
