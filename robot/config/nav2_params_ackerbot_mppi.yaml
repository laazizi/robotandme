# nav2 pour ACKERBOT, VARIANTE MPPI (voir le bloc FollowPath) : le chassis de robot A converti en TRICYCLE CLASSIQUE
# (roue directrice a servo DEVANT l'essieu moteur, x_s = +0.36 m ; sens de
# marche inverse le 04/09/2026, l'avant est le cote de la roue directrice).
#
# DERIVE de nav2_params.yaml (robot A) le 03/09/2026 : tout ce qui a ete regle
# par des mesures y est conserve a l'identique (costmaps, delais, inflation,
# collision_monitor). SEULEMENT ce qui suppose une rotation sur place change :
#   . controleur  DWB -> Regulated Pure Pursuit, sans rotate-to-heading,
#                 marche arriere autorisee ;
#   . planificateur NavFn -> SmacPlannerHybrid, Reeds-Shepp, qui RESPECTE le
#                 rayon de braquage minimal ;
#   . comportements : plus de "spin" ; arbre bt_ackerbot.xml sans Spin ;
#   . empreinte : 13 cm plus longue vers l'arriere (roue directrice a -0.36).
# POURQUOI : ce robot ne pivote pas sur place. Quand nav2 le lui demande, le
# firmware refuse et braque a fond A L'ARRET puis maintient -- pire cas de
# couple et de chauffe pour un servo RC de 10 kg.cm.
#
# VALEURS DERIVEES DU FIRMWARE, jamais saisies a la main (regle du CLAUDE.md) :
# minimum_turning_radius, regulated_linear_scaling_min_radius et la rotation
# max viennent de config/ackerbot_geometry.env, GENERE depuis robot.h par
# bin/gen_ackerbot_geometry.py et injecte au lancement par
# bin/nav_profile_ackerbot.sh. Les nombres ecrits ici ne sont que des valeurs
# de repli lisibles ; c'est le profil qui fait foi.
# Ne PAS toucher nav2_params.yaml (robot A) pour ce robot : fichiers separes.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    # CES DEUX VALEURS SONT LIEES, et les monter ensemble est indispensable.
    # default_server_timeout est en MILLISECONDES (defaut nav2 : 20), et le code
    # de nav2_behavior_tree l'ECRETE :
    #     max_timeout_ = bt_loop_duration * 0.5
    # Avec bt_loop_duration a 10 ms, le delai d'attente d'un serveur d'action
    # etait donc plafonne a CINQ MILLISECONDES. Sur cette machine, ou l'on
    # mesure regulierement de la contention, c'est intenable : nav2 abandonnait
    # le but avant meme d'avoir commence, avec
    #   Timed out while waiting for action server to acknowledge goal request
    # 16 fois, et des buts qui echouaient en 0,1 s. Monter le seul
    # default_server_timeout n'aurait rien change a cause de l'ecretage.
    # bt_loop_duration a 100 ms = arbre cadence a 10 Hz, comme le controleur.
    # A 0,30 m/s cela represente 3 cm de trajet entre deux evaluations : sans
    # consequence pour une tondeuse, et cela divise par dix le cout de parcours
    # de l'arbre. Le delai effectif devient 50 ms, soit 2,5 fois le defaut nav2.
    # 500 / 250 ET NON 100 / 50 DANS CE FICHIER (RPP garde 100 / 50).
    # Le mecanisme est celui deja documente juste au-dessus : nav2 ECRETE
    # default_server_timeout a bt_loop_duration * 0.5. A 100 ms de boucle, le
    # delai d attente d un serveur d action ne vaut donc que 50 ms.
    # MESURE le 04/09/2026 : MPPI tient 8 Hz la plupart du temps mais subit des
    # blocages ISOLES de 1 a 3,4 s (cadence tombee a 0,29 puis 0,89 Hz). Un
    # seul de ces blocages depasse les 50 ms d un facteur vingt : l arbre
    # abandonnait le but en 2,6 s, robot immobile, alors que le planificateur
    # avait bel et bien trouve un chemin.
    # 500 ms de boucle = arbre a 2 Hz, ce qui reste au-dessus de la
    # replanification a 1 Hz du RateController, et donne 250 ms de tolerance.
    # A RESSERRER si les blocages de MPPI sont un jour elimines : un delai large
    # masque une lenteur au lieu de la signaler.
    bt_loop_duration: 500
    default_server_timeout: 250
    # NOTRE arbre de comportement, et non celui de nav2. Un seul changement :
    # l'ordre des actions de degagement. L'amont essaie d'abord d'effacer les
    # costmaps, PUIS DE TOURNER SUR PLACE, PUIS D'ATTENDRE 5 s, et ne recule
    # qu'en quatrieme. Sur ce chassis non circulaire (0.54 x 0.50 m), tourner
    # sur place contre un obstacle balaie les coins du contour dedans : la
    # rotation est refusee et le robot reste coince. Mesure : 8 "Goal failed"
    # pour UN SEUL "BackUp" dans le journal.
    # Reculer passe donc en deuxieme, juste apres l'effacement des costmaps qui
    # est gratuit et sans mouvement. Details dans config/bt_mowbot.xml.
    # __HOME__ est substitue par install.sh : les YAML n'acceptent pas de
    # variable d'environnement, et le chemin doit etre valide DANS le conteneur
    # (le code est monte au meme chemin dedans et dehors).
    default_nav_to_pose_bt_xml: "__HOME__/mowbot/config/bt_ackerbot.xml"
    # LES DEUX ARBRES, PAS UN SEUL. bt_navigator charge a l'ACTIVATION un arbre
    # par navigateur : NavigateToPose ET NavigateThroughPoses. Ne remplacer que
    # le premier laisse le second retomber sur l'arbre AMONT de nav2, qui
    # contient <Spin> ; au chargement ce noeud attend le serveur d'action "spin"
    # -- retire ici -- et l'activation ECHOUE :
    #   Exception when loading BT: Action server spin not available
    #   Failed to bring up all requested nodes. Aborting bringup.
    # Vecu le 03/09/2026 : bt_navigator et waypoint_follower restaient inactifs,
    # tout but etait rejete. Un essai a blanc en "configure" ne le voit PAS : les
    # arbres se chargent a l'activation.
    default_nav_through_poses_bt_xml: "__HOME__/mowbot/config/bt_ackerbot_through_poses.xml"

controller_server:
  ros__parameters:
    # 10 Hz et non 20 : a 0.30 m/s le robot avance 3 cm entre deux cycles, ce
    # qui reste tres fin devant son gabarit. Sur une Raspberry Pi 4, 20 Hz
    # doublait inutilement la charge du controleur -- or c'est la saturation
    # (charge 24 sur 4 coeurs) qui faisait rejeter les messages dans RViz.
    #
    # 8 Hz ET NON 10 DANS CE FICHIER (le fichier RPP garde 10). MESURE : MPPI
    # tient 5,2 a 9,2 Hz sur cette machine, donc annoncer 10 produit des
    # "Control loop missed its desired rate" a repetition. Une cadence TENUE
    # vaut mieux qu une cadence ratee : le lisseur de vitesse et le deadman du
    # firmware raisonnent sur des periodes regulieres. model_dt suit (1/8).
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # robot de 58 cm de long : viser 8 cm etait irrealiste (le dernier
      # centimetre prenait plus longtemps que tout le trajet, a 0.048 m/s).
      xy_goal_tolerance: 0.12
      # 3.15 rad, soit PLUS DE 180 DEGRES : autant dire "le cap n'importe pas".
      # A 0.20 rad (11,5 deg) le robot devait finir aligne sur le cap demande, donc
      # il PIVOTAIT SUR PLACE a chaque arrivee -- jusqu'a 3 s par point a
      # max_vel_theta 1.0 rad/s, pour une orientation dont on n'a le plus souvent
      # rien a faire sur un point de passage.
      #
      # QUAND LE REMETTRE SERRE : si un point exige une orientation precise --
      # aborder une rangee de tonte dans le bon sens, se presenter face a une
      # station de charge, franchir un passage etroit. Le cap de chaque point
      # reste transmis dans le but : c'est seulement le CONTROLE d'arrivee qui
      # ne l'exige plus.
      # Variante plus explicite si l'on veut ignorer le cap par construction :
      #   plugin: "nav2_controller::PositionGoalChecker"   (ne verifie que x, y)
      # On garde SimpleGoalChecker : un seul nombre a changer pour revenir en
      # arriere, contre un changement de greffon.
      yaw_goal_tolerance: 3.15
      stateful: True
    # ==========================================================
    #  CONTROLEUR : MPPI  (Model Predictive Path Integral)
    #
    #  DERIVE de nav2_params_ackerbot.yaml le 04/09/2026. SEUL le bloc
    #  FollowPath change ; costmaps, arbre, comportements, lisseur et
    #  collision_monitor sont IDENTIQUES au fichier RPP, qui reste la
    #  reference validee au sol. Bascule par ACKERBOT_CONTROLLER dans
    #  config/speeds.env (rpp | mppi), lue par bin/nav_profile_ackerbot.sh.
    #
    #  POURQUOI : RPP est un SUIVEUR de chemin, il ne contourne rien de
    #  lui-meme -- devant un obstacle il s arrete et attend la replanification
    #  a 1 Hz. MPPI echantillonne des centaines de trajectoires sur un horizon
    #  et choisit la meilleure contre la costmap : il esquive en continu.
    #  Ce que MPPI n apporte PAS : de la vitesse de pointe. Le plafond vient du
    #  lidar a 6 Hz (cf. speeds.env), pas du controleur. Le gain est sur la
    #  vitesse MOYENNE en terrain encombre.
    #
    #  Tous les noms de parametres ci-dessous ont ete releves dans les
    #  bibliotheques INSTALLEES (libmppi_controller.so, libmppi_critics.so),
    #  pas dans une documentation : nav2_mppi_controller 1.3.12.
    #
    #  TROIS ESSAIS AU SOL LE 04/09/2026. Etat : PLAUSIBLE, JAMAIS VALIDE --
    #  et le dernier echec n est PAS imputable a MPPI. Le planificateur ne
    #  trouvait aucun chemin : mesure sur la carte, le plus grand cercle libre
    #  autour du robot faisait 0,40 m de RAYON, pour un robot de 0,62 x 0,50 m
    #  dont le virage le plus serre balaie un anneau de 0,485 m de large. Aucun
    #  chemin Reeds-Shepp NE PEUT exister dans un tel espace, quel que soit le
    #  controleur. MPPI reste a juger dans un espace degage : il faut au moins
    #  ~1,5 m de rayon libre autour du robot.
    #
    #  CE QUI A ETE DIAGNOSTIQUE ET CORRIGE :
    #  Charge et actif sans erreur (7 critics, modele Ackermann, min_turning_r
    #  injecte), mais MESURE :
    #    "Control loop missed its desired rate of 10.0000 Hz.
    #     Current loop rate is 6.8786 Hz."  puis 6.9381 Hz
    #  Il tourne donc a ~6,9 Hz au lieu de 10, alors que le CPU du
    #  controller_server reste a 21,8 % d'UN coeur sur six et la machine a 55 %
    #  d'inactivite. Ce n'est donc PAS un manque de puissance : c'est une
    #  latence par cycle, tres probablement le CostCritic en
    #  consider_footprint avec une inflation locale de 0,05 m -- la
    #  bibliotheque avertit explicitement qu'elle ne peut pas accelerer le
    #  controle d'empreinte par le champ de cout dans ce cas.
    #  Essai 1 (1500 trajectoires, horizon 3 s, mode empreinte) : 6,9 Hz.
    #  Essai 2 (800 trajectoires, horizon 2 s, mode empreinte)   : min 1,78 Hz.
    #    ALLEGER L ECHANTILLONNAGE N A RIEN DONNE -- la preuve que le cout
    #    n etait pas dans le nombre de trajectoires.
    #  Essai 3 (mode POINT + inflation 0,42) : min 5,21 Hz, max 9,17, deux
    #    rates seulement, et l avertissement d inflation de la bibliotheque a
    #    DISPARU. C etait le bon correctif : le cout etait le controle
    #    d empreinte effectue SOUS LE VERROU DU COSTMAP. Le CPU est reste a
    #    19 % d un coeur sur six pendant les trois essais : jamais un manque de
    #    puissance, toujours une attente.
    #  Reste a faire : confirmer la cadence avec 8 Hz annonces, puis juger le
    #    comportement dans un espace degage.
    #  Les deux buts d'essai ont echoue, mais PAS a cause de MPPI : le
    #  planificateur repondait "no valid path found" et "Start occupied" en
    #  boucle, l'arbre annulait et relancait, et le robot pivotait sur place
    #  pendant 50 s -- le pire cas pour un servo de 10 kg.cm. Ces echecs de
    #  planification sont un probleme A PART, a traiter avant de rejuger MPPI.
    # ==========================================================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # ESSAI 2 (04/09/2026) : 2 s d horizon, 800 trajectoires, un point sur 4
      # teste dans CostCritic -- l essai 1 (30 pas, 1500, un sur 2) tenait 6,9 Hz
      # au lieu de 10. 2 s a 0.30 m/s = 60 cm d anticipation, encore au-dessus
      # du lookahead RPP de 45 cm.
      time_steps: 20
      model_dt: 0.125
      # 1500 et non 2000 (defaut) : la Jetson NX a 6 coeurs dont ~3 libres, et
      # CostCritic avec consider_footprint est couteux (voir plus bas). A
      # ajuster APRES mesure de charge, pas avant.
      batch_size: 800
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      # ---- LE PARAMETRE QUI FAIT DE CE FICHIER UN FICHIER ACKERMANN ----
      # Sans lui MPPI echantillonnerait des rotations pures, que ce tricycle ne
      # sait pas faire. min_turning_r est DERIVE du firmware et injecte par le
      # profil (config/ackerbot_geometry.env), jamais saisi a la main.
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.36
      # ---- enveloppe de vitesse (injectee par le profil) ----
      vx_max: 0.30
      # MARCHE ARRIERE BRIDEE, pas interdite : -0.15 m/s, moitie de l avant.
      # Exigence utilisateur : reculer sert a MANOEUVRER, pas a se deplacer.
      # L equivalent MPPI du reverse_penalty de Smac est PreferForwardCritic,
      # dont le poids est monte a 20 (defaut 5) plus bas.
      vx_min: -0.15
      vy_max: 0.0
      # 0.83 rad/s = v_max / R_min : la rotation coherente avec le rayon.
      wz_max: 0.83
      ax_max: 0.8
      ax_min: -1.2
      az_max: 2.0
      # ecart-type du bruit d echantillonnage
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      # false : l affichage des trajectoires coute du CPU pour rien hors debug
      visualize: false
      regenerate_noises: false
      # 1.0 s, MESUREE sur ce Jetson, meme valeur que partout ailleurs dans ce
      # fichier (TF publiees ~280 ms apres l horodatage des scans, a-coups sous
      # charge). Voir le commentaire long dans le costmap local.
      transform_tolerance: 1.0
      # REBROUSSEMENTS : Smac en Reeds-Shepp peut produire des chemins avec
      # inversion de sens. enforce_path_inversion fait respecter ces points de
      # rebroussement au lieu de les lisser, ce qui est indispensable ici : un
      # rebroussement lisse deviendrait un virage que le robot ne peut pas
      # prendre.
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      # TROIS critics ECARTES VOLONTAIREMENT :
      #  - GoalAngleCritic : yaw_goal_tolerance vaut 3.15 ici, le cap d arrivee
      #    n a aucune importance sur un point de tonte. L inclure ferait
      #    manoeuvrer le robot en arcs pres du but pour un cap dont on ne fait
      #    rien -- or il ne peut pas pivoter sur place pour l obtenir.
      #  - TwirlingCritic : il penalise la rotation sur place. Un Ackermann en
      #    est incapable par construction : ce serait du CPU pour rien.
      #  - VelocityDeadbandCritic : deadband_velocity vaut [0,0,0] (voir
      #    velocity_smoother), il n aurait rien a faire.
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # CostCritic (et non ObstaclesCritic, plus ancien) : evitement d obstacles.
      # consider_footprint TRUE parce que ce chassis N EST PAS CIRCULAIRE
      # (0.62 x 0.50 m, empreinte a 10 sommets) : tester le seul centre du robot
      # serait faux, exactement la raison pour laquelle robot A utilise
      # ObstacleFootprint et non BaseObstacle dans DWB.
      # A SURVEILLER : la bibliotheque avertit que sans inflation >= rayon
      # circonscrit (~0.41 m ici, or l inflation locale vaut 0.05 volontairement)
      # le controle d empreinte ne peut pas etre accelere par le champ de cout
      # et devient LENT. On garde le costmap tel quel -- il est valide au sol --
      # et on MESURE la charge. Si elle ne passe pas, deux issues : monter
      # l inflation locale DANS CE FICHIER SEULEMENT, ou passer
      # consider_footprint a false en acceptant un test au centre.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # FALSE depuis l essai 3 (04/09/2026), et c est LE correctif de cadence.
        # En mode empreinte, CostCritic teste un polygone de 10 sommets pour
        # chaque point de chaque trajectoire -- des dizaines de milliers de
        # consultations SOUS LE VERROU DU COSTMAP. Mesure : la boucle tombait a
        # 1,78 Hz alors que le CPU restait a 19 % d un coeur, donc elle
        # ATTENDAIT. Meme signature que celle deja documentee pour robot A
        # (costmap local monte a 10 Hz : 2,17 a 5,76 Hz pour 43 % d un coeur).
        # Halver l echantillonnage n y avait presque rien change, ce qui
        # confirme que le cout n est pas dans le nombre de trajectoires.
        # CONTREPARTIE OBLIGATOIRE : le robot devient un POINT pour ce critere,
        # sa taille doit donc etre portee par l INFLATION -- voir le
        # local_costmap de CE fichier, monte a 0,42 m. C est la configuration
        # MPPI standard ; l inflation minuscule de robot A n existe que parce
        # que DWB utilisait ObstacleFootprint, un paradigme different.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 4
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      # PathAlign / PathFollow / PathAngle tirent vers le chemin de Smac, qui
      # est deja kinematiquement faisable : c est lui qu il faut suivre, MPPI ne
      # s en ecarte que pour eviter.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
      # L EQUIVALENT MPPI DU reverse_penalty : 20 au lieu du defaut 5, pour que
      # la marche arriere reste un moyen de manoeuvre et non de deplacement.
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      # RETOUR A 5 Hz. Je l avais monte a 10 pour l aligner sur
      # controller_frequency, sur un raisonnement -- jamais sur une mesure. Cela
      # double le travail de raytracing du costmap, et le controleur BLOQUE sur le
      # verrou du costmap pendant sa mise a jour.
      # Symptome constate ensuite : le controleur tournait a 2,17 a 5,76 Hz au lieu
      # de 10, tout en n utilisant que 43 % d UN coeur sur six -- donc il ATTENDAIT,
      # il ne calculait pas. La machine avait 65 % d inactivite (213 % sur 600 %).
      # 5 Hz reste deux fois la cadence du lidar (2,5 scans par mise a jour) : on ne
      # perd aucune information reelle, le lidar ne fournit rien de plus vite.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      # 4 cm au lieu de 2 : QUATRE fois moins de cellules a inflater et a
      # parcourir a chaque cycle. C'est le plus gros gain de charge, et 4 cm
      # reste fin face a un robot de 46 cm d'entraxe.
      resolution: 0.04
      # Contour REEL (base_link = milieu de l'essieu), releve sur photo :
      #   - disque bois rayon 0.22
      #   - point le plus large = les PNEUS, +/-0.26 (entraxe 0.48 + largeur roue)
      #   - bras AVANT portant la ROUE DIRECTRICE : contact a +0.36, rayon
      #     ~0.032 -> avant de l'empreinte a +0.40. L'empreinte a ete mise en
      #     MIROIR le 04/09/2026 avec l'inversion du sens de marche : l'avant
      #     du robot est le cote de la roue directrice. Le point le plus
      #     eloigne du centre de rotation reste un coin, et la roue directrice
      #     deborde de 0,139 m au-dela du cercle de l'essieu moteur : ce
      #     debordement se produit desormais DEVANT, la ou le lidar regarde.
      # Un robot_radius unique devrait couvrir 0.27 partout, soit 5 cm de
      # bourrelet inutile tout autour -> passages refuses sans raison. Utile
      # aussi maintenant que la marche arriere est autorisee : la languette
      # est protegee sans elargir l'arriere.
      # LARGEUR RAMENEE de 0.26 a 0.25 (demande utilisateur, 1 cm).
      # Le bord exterieur des roues est a ±0.2529 m (demi-entraxe calibre
      # 0.23035 + demi-largeur de roue 0.0225). Avec l'ancienne valeur, le
      # contour effectif atteignait ±0.270 padding compris : un obstacle a 1 cm
      # de la roue tombait DANS l'empreinte, et DWB rejetait les 860
      # trajectoires ("ObstacleFootprint/Trajectory Hits Obstacle", 540 fois
      # dans le journal). A ±0.250 + 0.010 de padding, le contour s'arrete a
      # 0.260 et laisse 3 mm devant un obstacle a 1 cm.
      # ATTENTION : 3 mm, c'est peu. Une erreur de localisation d'un centimetre
      # suffit alors a ce que la roue touche VRAIMENT. Cette marge a ete reduite
      # sciemment ; ne pas la rogner davantage sans y repenser.
      footprint: "[[-0.22, -0.10], [-0.08, -0.25], [0.08, -0.25], [0.20, -0.14], [0.40, -0.08], [0.40, 0.08], [0.20, 0.14], [0.08, 0.25], [-0.08, 0.25], [-0.22, 0.10]]"
      # 1 cm (etait 2) : marge ajoutee TOUT AUTOUR du contour. Le contour est
      # deja releve au reel ; 2 cm de plus rendaient des passages justes
      # inexecutables -- le planificateur global les jugeait franchissables et
      # le controleur refusait ensuite d'y aller.
      footprint_padding: 0.01
      # PAS de static_layer ici, volontairement. Le costmap LOCAL doit refleter
      # ce que le lidar voit MAINTENANT. En y superposant la carte SLAM, il
      # heritait de tous les faux echos accumules dans la carte -- et ceux-la
      # ne s'effacent jamais par balayage laser, contrairement aux obstacles
      # observes. Constat : le lidar voyait l'obstacle a 0.38 m alors que la
      # carte gardait une cellule occupee a 0.26 m, pile sur le bord du
      # footprint -> "No valid trajectories out of 860", blocage total.
      # La carte statique reste utilisee par le costmap GLOBAL, pour planifier.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0,42 m ICI ET SEULEMENT ICI (le fichier RPP garde 0,05).
        # 0,42 = rayon CIRCONSCRIT de l empreinte : c est le minimum que la
        # bibliotheque reclame pour que le controle de collision puisse etre
        # accelere par le champ de cout, et c est indispensable des lors que
        # CostCritic ne teste plus l empreinte (consider_footprint: false).
        # Le robot etant traite comme un point, c est cette inflation qui
        # PORTE sa taille : la baisser rendrait MPPI aveugle a son gabarit.
        # NE PAS reporter cette valeur dans nav2_params_ackerbot.yaml : RPP y
        # utilise le contour exact, et l y monter compterait la taille du robot
        # DEUX FOIS -- c est le "ca bloque pour rien" documente pour robot A.
        # Consequence assumee : le robot gardera plus de distance aux obstacles
        # qu avec RPP. Pour eviter une personne, c est ce qu on veut ; pour
        # tondre au ras d une bordure, ce sera a rediscuter.
        # 0,20 m ET NON 0,42 : MESURE le 04/09/2026, capture RViz a l appui.
        # A 0,42 (rayon circonscrit, ce que reclame la bibliotheque) le robot
        # etait EMMURE dans ce salon : 44 % de la costmap locale bloquante,
        # 25 % seulement libre, et le plus grand disque a cout nul autour de
        # lui ne faisait que 0,32 m de rayon -- pour un robot qui a besoin d un
        # anneau de 0,485 m. Ni MPPI ni RPP ne peuvent manoeuvrer la-dedans.
        # 0,20 m est SOUS le rayon inscrit (0,23), donc la bande bloquante
        # autour de chaque obstacle tombe a 0,20 m au lieu de 0,23.
        # MARGE REDUITE, ASSUMEE, POUR ESSAI EN INTERIEUR. Le robot est alors
        # represente pour MPPI par un disque de 0,20 m, plus petit que sa
        # realite (0,62 x 0,50 m) : il peut froler un coin avec son avant, qui
        # depasse de 0,40 m. CE QUI RATTRAPE : le collision_monitor, lui,
        # travaille sur l EMPREINTE EXACTE publiee, et coupe /cmd_vel 1,5 s
        # avant contact. C est la derniere ligne de defense, et elle est juste.
        # DEHORS, remonter a 0,42 : la place ne manque plus et la marge
        # geometrique redevient gratuite.
        inflation_radius: 0.20
        cost_scaling_factor: 3.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.04
      # meme contour reel que le local_costmap (cf. commentaire plus haut)
      footprint: "[[-0.22, -0.10], [-0.08, -0.25], [0.08, -0.25], [0.20, -0.14], [0.40, -0.08], [0.40, 0.08], [0.20, 0.14], [0.08, 0.25], [-0.08, 0.25], [-0.22, 0.10]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0,18 m ICI ET SEULEMENT ICI (le fichier RPP garde 0,50, mesure et
        # valide pour NavFn). Pourquoi : nav2 marque a 253
        # (INSCRIBED_INFLATED_OBSTACLE, que Smac traite comme OCCUPE) toute
        # cellule a moins du RAYON INSCRIT d un obstacle. La bande bloquante
        # vaut donc min(inflation, 0,23). A 0,50 chaque obstacle -- meme un
        # pied de chaise isole -- bloque un disque de 0,46 m de diametre, et
        # les couloirs libres se referment : "no valid path found" en boucle.
        # A 0,18 la bande tombe a 0,18 m et Smac retrouve des passages.
        # DIVISION DU TRAVAIL ASSUMEE : le planificateur devient PERMISSIF (il
        # trouve un chemin), le controleur reste CONSERVATEUR (MPPI + son
        # inflation locale + le collision_monitor sur l empreinte exacte). Ce
        # n est pas le planificateur qui garde le robot a distance.
        # Contrepartie : les chemins passeront plus pres des obstacles qu avec
        # les 0,50 mesures pour robot A. A remonter dehors.
        inflation_radius: 0.18
        cost_scaling_factor: 2.5
      # TRUE, ET NE PAS LE REPASSER A FALSE. Je l avais mis a False pour soulager
      # le WiFi -- un gain THEORIQUE, jamais mesure -- et cela a rendu le costmap
      # global INOBTENABLE : ni /global_costmap/costmap ni son topic _updates ne
      # publiaient plus rien. Consequences constatees :
      #   . nodes/pathcheck.py, l outil qui MESURE la marge des chemins aux
      #     obstacles, repondait "pas de costmap globale" ;
      #   . l affichage du costmap global dans RViz ne recevait plus rien.
      # Le publieur est pourtant RELIABLE + TRANSIENT_LOCAL : le probleme n est
      # pas la QoS, c est qu il n y a plus aucun message a retenir.
      # La congestion RViz que je cherchais a corriger venait en realite de la
      # fraicheur des TF, pas du volume du costmap.
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # __HOME__ est substitue a l'installation (install.sh) : aucun chemin
    # en dur, l'arborescence doit suivre le SBC (Jetson -> Raspberry Pi).
    # Inutilise tant qu'on cartographie en SLAM (slam_toolbox fournit la carte).
    yaml_filename: "__HOME__/mowbot/maps/arena.yaml"

planner_server:
  ros__parameters:
    # 1 Hz et non 5 : SmacPlannerHybrid est bien plus couteux que NavFn (recherche
    # dans l'espace (x, y, cap) avec 64 caps), et l'arbre ne replanifie qu'a
    # 1 Hz de toute facon (RateController hz="1.0" dans bt_ackerbot.xml).
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # L'identifiant reste "GridBased" : c'est le default_planner de l'arbre.
    GridBased:
      # SYNTAXE JAZZY "paquet::Classe" (install.sh convertit vers Humble).
      # NavFn (robot A) planifie sur une grille sans notion de cap : ses chemins
      # font des angles droits qu'un tricycle ne peut pas suivre, et RPP les
      # coupe ou bloque. SmacPlannerHybrid cherche dans (x, y, cap) avec des
      # primitives de mouvement a rayon borne : chaque chemin qu'il rend est
      # PHYSIQUEMENT SUIVABLE par ce robot.
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # 0.25 m : meme valeur et meme raison que robot A (viser une cellule voisine
      # quand le but exact est dans un halo ou contre un mur).
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      # allow_unknown A TRUE : LE REGLAGE INDISPENSABLE D'UNE TONDEUSE, voir la
      # longue justification dans nav2_params.yaml (83 % d'inconnu sur la carte
      # du salon, sinon tout l'inconnu se comporte comme un mur).
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP et non DUBIN : autorise la marche arriere dans le chemin
      # lui-meme. Sans rotation sur place, c'est la SEULE facon de se
      # retourner dans un espace etroit (creneau). Le firmware gere v < 0.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      # LE PARAMETRE QUI FAIT DE CE FICHIER UN FICHIER ACKERMANN.
      # R = |x_s| / tan(delta_max) = 0.36 / tan(45 deg) = 0.36 m. DERIVE du firmware
      # (config/ackerbot_geometry.env, injecte par bin/nav_profile_ackerbot.sh),
      # JAMAIS saisi a la main : une macro qui codait tan(0,52) en dur a deja
      # produit 75 % d'erreur sur cette valeur. Sous-estimer ce rayon fait
      # planifier des virages que le robot ne peut pas prendre.
      minimum_turning_radius: 0.36
      # MARCHE ARRIERE = MOYEN DE MANOEUVRE, PAS MODE DE DEPLACEMENT.
      # Exigence de l'utilisateur du 04/09/2026 : le robot peut reculer pour
      # TOURNER, pas pour naviguer. Smac multiplie le cout d'un segment arriere
      # par ce facteur, donc reculer de d metres n'est retenu que si cela
      # economise plus de (P-1)*d metres de trajet AVANT :
      #     P=2  (defaut nav2, ancienne valeur) : recule librement, meme pour
      #          simplement avancer -> ce n'est pas ce qu'on veut
      #     P=8  : reculer 0,5 m doit economiser 3,5 m ; reculer 3 m, 21 m
      #          -> le deplacement en marche arriere ne se produit plus
      # CE QUE CELA N'INTERDIT PAS, et c'est le point : quand la boucle en
      # marche avant NE PASSE PAS (haie, mur, rangee serree), elle est
      # infaisable a n'importe quel prix ; le demi-tour en trois points reste
      # alors le seul chemin trouve, donc choisi. La penalite ne supprime pas
      # la marche arriere, elle la DIFFERE jusqu'a ce qu'elle soit necessaire.
      # NE PAS mettre allow_reversing a false dans RPP pour autant : le
      # controleur doit pouvoir EXECUTER ces segments, et la recuperation
      # BackUp de l'arbre en depend (c'est la seule qui reste depuis le retrait
      # de Spin). Interdire au controleur ce que le planificateur produit
      # bloquerait le robot.
      # Repere geometrique : un demi-tour en marche avant seule n'est possible
      # que si l'ecart entre rangees depasse 2*R_min = 0,80 m ; en dessous il
      # faut environ 1 m de degagement au bout de la rangee.
      reverse_penalty: 8.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      # 10 m et NON 20 (defaut nav2) : cette table d'heuristique Reeds-Shepp se
      # PRECALCULE a la configuration, en (taille/resolution)^2 x caps. A 20 m et
      # 0.04 m de resolution : 500 x 500 cellules x 64 caps -> MESURE 84 s de
      # configure sur la Jetson NX, pendant lesquels le lifecycle_manager attend
      # et l'operateur croit la pile bloquee. A 10 m : 250 x 250, MESURE 24 s
      # sur la meme machine. La table ne sert qu'a l'heuristique PRES du but ;
      # au-dela Smac retombe sur une distance simple. 10 m couvre un jardin.
      # Le lifecycle_manager n'a pas de delai de configuration (verifie dans la
      # bibliotheque installee : seuls bond_timeout et bond_respawn_* existent),
      # donc 24 s ne mettent pas la pile en danger ; c'est l'attente qui gene.
      lookup_table_size: 10.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # PAS de "spin" : ce robot ne pivote pas sur place (voir l'en-tete). BackUp
    # reste : reculer droit, roue directrice au centre, le firmware sait faire.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    # 0.6 s au lieu de 0.3. MESURE sur le Jetson : les TF sont publiees ~280 ms
    # apres l'horodatage des scans, la tolerance par defaut de 0.3 tombait donc
    # PILE sur le seuil -- d'ou 73 erreurs "Extrapolation Error looking up
    # target frame" et des buts qui echouaient une fois sur deux. La valeur par
    # defaut de nav2 est calee sur des machines plus rapides.
    # Ce n'est pas gratuit : nav2 accepte de planifier sur une pose vieille de
    # 0.6 s, soit 18 cm parcourus a 0.30 m/s. Acceptable pour une tondeuse ;
    # a resserrer si un jour le SLAM publie plus vite.
    transform_tolerance: 1.0
    max_rotational_vel: 0.15
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # theta = v_max / R_min = 0.30 / 0.36 = 0.83 rad/s : la rotation max qui
    # reste COHERENTE avec le rayon de braquage a la vitesse de croisiere.
    # Injecte par le profil (ACKERBOT_MAX_VEL_THETA, derive), comme les autres.
    max_velocity: [0.30, 0.0, 0.83]
    min_velocity: [-0.30, 0.0, -0.83]
    max_accel: [0.8, 0.0, 2.0]
    max_decel: [-1.2, 0.0, -2.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ============================================================
#  collision_monitor — OBLIGATOIRE a partir de Jazzy
#
#  Ce noeud n'existait pas dans le bringup Humble. navigation_launch.py le
#  demarre desormais systematiquement, et s'il ne trouve pas sa configuration
#  il echoue ("parameter 'observation_sources' is not initialized"). Le
#  lifecycle_manager abandonne alors TOUTE la pile : controller_server et
#  planner_server restent "inactive", les buts sont acceptes mais rien ne
#  bouge, et aucun noeud ne s'abonne a /scan.
#
#  Role : dernier rempart materiel-logiciel. Il surveille /scan et bride ou
#  coupe /cmd_vel si une collision devient imminente, independamment du
#  controleur. Utile pour une tondeuse.
# ============================================================
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # 0.6 s au lieu de 0.3. MESURE sur le Jetson : les TF sont publiees ~280 ms
    # apres l'horodatage des scans, la tolerance par defaut de 0.3 tombait donc
    # PILE sur le seuil -- d'ou 73 erreurs "Extrapolation Error looking up
    # target frame" et des buts qui echouaient une fois sur deux. La valeur par
    # defaut de nav2 est calee sur des machines plus rapides.
    # Ce n'est pas gratuit : nav2 accepte de planifier sur une pose vieille de
    # 0.6 s, soit 18 cm parcourus a 0.30 m/s. Acceptable pour une tondeuse ;
    # a resserrer si un jour le SLAM publie plus vite.
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Ralentit a l'approche plutot que de bloquer net : le robot est deja tres
    # lent (0.055 m/s), un arret franc le figerait pour un simple reflet.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.10
      max_height: 2.0
      enabled: True

# ============================================================
#  docking_server — OBLIGATOIRE a partir de Jazzy
#
#  Autre noeud absent du bringup Humble : il gere l'accostage sur une station
#  de recharge. navigation_launch.py le demarre toujours, et sans plugin
#  declare il refuse de se configurer ("Charging dock plugins not given!"),
#  ce qui fait AVORTER TOUTE la pile nav2 par le lifecycle_manager.
#
#  Le robot n'a pas de station de recharge : on declare le plugin standard
#  pour satisfaire le noeud, sans declarer aucune station. Le jour ou une
#  base de recharge existera, il suffira de lister les stations dans `docks`.
# ============================================================
docking_server:
  ros__parameters:
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
