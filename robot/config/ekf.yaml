# Fusion odometrie roues + IMU avec robot_localization (EKF)
# Tourne sur le SBC. Sortie : /odometry/filtered + TF odom -> base_link.
#
# Convention des vecteurs *_config (15 booleens) :
#   [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

ekf_filter_node:
  ros__parameters:
    # 30 Hz et non 50 : la Pi 4 n'y arrivait pas (flot de "Failed to meet update
    # rate", jusqu'a 1.3 s pour un cycle de 20 ms) et la sortie tombait a 9 Hz.
    # Inutile de tourner plus vite que les capteurs : /odom est a 10 Hz, l'IMU a
    # 20 Hz -- au-dela l'EKF ne fait que predire dans le vide.
    # 15 Hz. Sur le Jetson en conteneur, 30 Hz laissaient les TF publiees avec
    # UNE SECONDE de retard sur les scans : slam_toolbox ne pouvait alors placer
    # aucun scan ("queue is full" sur tous), donc aucune carte. Inutile de
    # tourner plus vite que les capteurs : /odom arrive a 10 Hz, l'IMU a 20.
    frequency: 15.0
    sensor_timeout: 0.2
    two_d_mode: true            # tondeuse : on reste dans le plan
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odometrie roues (mowbot_base) : SEULE la vitesse d'avance vx est fusionnee.
    # On NE prend PAS le vyaw des roues (fausse par le patinage en rotation) :
    # le cap vient entierement du gyro (imu0 ci-dessous).
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5

    # IMU (ICM-42688) : vitesse angulaire yaw du gyro — la reference du cap
    # a court terme. Pas d'orientation (data_raw), accelerations ignorees
    # (bruyantes sur une tondeuse qui vibre).
    # /imu/data_checked et non /imu/data_raw : nodes/imu_guard.py annule le
    # lacet quand le gyro est GELE. Sans ce filtre, une valeur figee (-24 deg/s
    # constants, constate le 28/08/2026) est integree comme une vraie rotation
    # et le robot pivote sans fin dans RViz.
    imu0: /imu/data_checked
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    # A venir : gps RTK via navsat_transform_node (odom1 / pose)
